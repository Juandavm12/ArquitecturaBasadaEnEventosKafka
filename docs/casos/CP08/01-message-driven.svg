<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="2054" viewBox="0 0 1280 2054" role="img" aria-label="CP-08 — Comunicación mediante Kafka"><rect width="100%" height="100%" fill="#f8fafc"/><g font-family="DejaVu Sans, sans-serif" xml:space="preserve"><text x="30" y="48" font-size="28" fill="#172b4d">CP-08 — Comunicación mediante Kafka</text>
<text x="30" y="88" font-size="18" fill="#172b4d">Flujo PoC auditado · evidencia real CP07 reutilizada · lectura por rol posterior</text>
<text x="30" y="130" font-size="20" fill="#172b4d">Entrada HTTP → orders-api → Kafka / orders.events → tres grupos independientes</text>
<text x="30" y="162" font-size="18" fill="#172b4d">inventory-service-group | billing-service-group | notification-service-group</text>
<text x="30" y="192" font-size="18" fill="#172b4d">Acciones locales simuladas; sin llamada HTTP/RPC de la API a los consumidores.</text>
<text x="30" y="234" font-size="18" fill="#005a70">kafka/src/app.js · líneas 25–30</text>
<text x="30" y="264" font-size="15" fill="#172b4d">25        correlationId: event.correlationId, topic };</text>
<text x="30" y="291" font-size="15" fill="#172b4d">26      try {</text>
<text x="30" y="318" font-size="15" fill="#172b4d">27        const metadata = await producer.send({ topic, acks: -1, timeout: 10000,</text>
<text x="30" y="345" font-size="15" fill="#172b4d">28          messages: [{ key: ids.orderId, value: JSON.stringify(event),</text>
<text x="30" y="372" font-size="15" fill="#172b4d">29            headers: { correlationId: ids.correlationId, eventId: ids.eventId } }] });</text>
<text x="30" y="399" font-size="15" fill="#172b4d">30        for (const { partition, baseOffset } of metadata) record({ ...ids, partition, baseOffset });</text>
<text x="30" y="434" font-size="18" fill="#005a70">kafka/src/consumer-runtime.js · líneas 70–78</text>
<text x="30" y="464" font-size="15" fill="#172b4d">70        connecting = consumer.connect();</text>
<text x="30" y="491" font-size="15" fill="#172b4d">71        await connecting;</text>
<text x="30" y="518" font-size="15" fill="#172b4d">72        if (stopping) return;</text>
<text x="30" y="545" font-size="15" fill="#172b4d">73        await consumer.subscribe({ topic, fromBeginning: true });</text>
<text x="30" y="572" font-size="15" fill="#172b4d">74        if (stopping) return;</text>
<text x="30" y="599" font-size="15" fill="#172b4d">75        await consumer.run({ autoCommit: false,</text>
<text x="30" y="626" font-size="15" fill="#172b4d">76          eachMessage: createMessageHandler({ role, instanceId,</text>
<text x="30" y="653" font-size="15" fill="#172b4d">77            action: createSimulatedAction({ role, delayMs }), logger: log,</text>
<text x="30" y="680" font-size="15" fill="#172b4d">78            commitOffsets: offsets =&gt; consumer.commitOffsets(offsets) }) });</text>
<text x="30" y="715" font-size="18" fill="#005a70">kafka/src/consumer-server.js · líneas 14–19</text>
<text x="30" y="745" font-size="15" fill="#172b4d">14    marker(false);</text>
<text x="30" y="772" font-size="15" fill="#172b4d">15    const settings = readSettings(process.env);</text>
