<text x="30" y="945" font-size="15" fill="#172b4d">3  export const ROLE_CONFIG = Object.freeze({</text>
<text x="30" y="972" font-size="15" fill="#172b4d">4    inventory: Object.freeze({ service: &apos;inventory-consumer&apos;, groupId: &apos;inventory-service-group&apos;,</text>
