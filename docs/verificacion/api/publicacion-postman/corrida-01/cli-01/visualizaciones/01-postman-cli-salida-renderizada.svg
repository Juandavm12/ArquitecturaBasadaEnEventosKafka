blicado en Kafka","orderId":"ORD-d84</text><text x="32" y="643" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve">  | 84470-cb78-48c9-befa-0c88fe1429f9"}</text><text x="32" y="670" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve">  -</text><text x="32" y="697" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve">  prepare   wait    dns-lookup   tcp-handshake   transfer-start   download   process   total  </text><text x="32" y="724" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve">  3 ms      12 ms   2 ms         481 us          347 ms           5 ms       1 ms      374 ms </text><text x="32" y="751" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve" /><text x="32" y="778" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve">  -</text><text x="32" y="805" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve">  | 'REQUEST_METHOD POST'</text><text x="32" y="832" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve">  | 'REQUEST_URL http://localhost:3000/orders'</text><text x="32" y="859" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve">  | 'REQUEST_BODY {"customerName":"Pedro","product":"Libro</text><text x="32" y="886" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve">  |  de arquitectura","quantity":1,"unitPrice":85000}'</text><text x="32" y="913" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve">  