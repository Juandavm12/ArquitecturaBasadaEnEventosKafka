e your Postman CLI, run:</text><text x="32" y="2020" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve" /><text x="32" y="2047" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve">postman update</text><text x="32" y="2074" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve" /><text x="32" y="2101" font-size="20" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="stdout-line" xml:space="preserve" /><text x="32" y="2158" font-size="15" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="metadata" xml:space="preserve">Fuente: docs/verificacion/api/publicacion-postman/corrida-01/cli-01/04-postman-stdout.txt</text><text x="32" y="2185" font-size="15" font-family="DejaVu Sans Mono, monospace" fill="#111827" class="metadata" xml:space="preserve">SHA-256 stdout: 9e8d25436f07b15700cfd740a2a44d550f5bb97bd918111eb73dce621b5cffd8</text></svg>